<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Register as a new Deliveroo courrier." />
    <title>Deliveroo — Courrier Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <main>
      <div class="brand-mark">
        <div class="logo-dot"></div>
        <span>Deliveroo — Courrier</span>
      </div>

      <h1>Join as a Courrier</h1>

      <form method="POST" action="/courrier/register">
        <label>
          Phone Number
          <input
            placeholder="+1 555 000 0000"
            type="tel"
            name="phoneNumber"
            autocomplete="tel"
            required
          />
        </label>
        <label>
          Password
          <input
            placeholder="Choose a password"
            type="password"
            name="password"
            autocomplete="new-password"
            required
          />
        </label>
        <button type="submit">Create Account</button>
      </form>

      <p class="auth-footer">
        Already registered? <a href="/courrier/login">Log in</a>
      </p>
    </main>
  </body>
</html>
