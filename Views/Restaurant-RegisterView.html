<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Register your restaurant on Deliveroo." />
    <title>Deliveroo — Restaurant Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <main>
      <div class="brand-mark">
        <div class="logo-dot"></div>
        <span>Deliveroo — Restaurant</span>
      </div>

      <h1>Register your Restaurant</h1>

      <form method="POST" action="/restaurant/register">
        <label>
          Restaurant Name
          <input
            placeholder="e.g. Pizza Palace"
            type="text"
            name="restaurantName"
            autocomplete="organization"
            required
          />
        </label>
        <label>
          Password
          <input
            placeholder="Choose a password"
            type="password"
            name="password"
            autocomplete="new-password"
            required
          />
        </label>
        <button type="submit">Create Account</button>
      </form>

      <p class="auth-footer">
        Already registered? <a href="/restaurant/login">Log in</a>
      </p>
    </main>
  </body>
</html>
