<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View and update your assigned deliveries." />
    <title>Deliveroo — Courrier Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <nav>
      <span class="brand">Deliveroo — Courrier</span>
      <form method="POST" action="/courrier/logout">
        <button type="submit">Log out</button>
      </form>
    </nav>

    <div class="container">

      <!--
        Each <li> inside {{assignments}} is server-built by CourrierController
        and contains the order ID, current status badge, and an inline
        status-update <form> with a <select> and submit button.
      -->
      <div class="card">
        <h2>Assigned Deliveries</h2>
        <ul class="item-list">
          {{assignments}}
        </ul>
      </div>

    </div>
  </body>
</html>
