<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Not Found · Deliveroo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Absolute path — works correctly regardless of which URL triggered the error -->
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body>
    <main>
      <div class="stack">
        <div class="badge">404 — Not Found</div>
      </div>
      <h1>We couldn't find that page</h1>
      <p>
        The page or resource you're looking for doesn't exist. It may have
        been moved, deleted, or the URL might be incorrect.
      </p>
      <div class="actions">
        <a class="button" href="/">Go back to Home</a>
        <a class="button secondary" href="javascript:history.back()">Go back</a>
      </div>
      <p class="small">
        Double-check the URL or use the navigation above to find what you need.
      </p>
    </main>
  </body>
</html>
